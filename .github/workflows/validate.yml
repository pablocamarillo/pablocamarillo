name: Validate profile

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test
      - run: node scripts/pinned-repositories.mjs --check
      - run: node --check docs/calendar.js
      - run: node scripts/build-pages.mjs
