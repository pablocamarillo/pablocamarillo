name: Refresh profile and deploy calendar

on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-profile.yml'
      - 'scripts/**'
      - 'docs/**'
      - 'data/**'
      - 'tests/**'

permissions: {}

concurrency:
  group: profile-calendar
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'pablocamarillo/pablocamarillo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.snapshot.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test
      - name: Fetch actual public contribution counts and levels
        run: node scripts/contributions.mjs
      - name: Refresh original team repository metadata
        run: node scripts/featured-project.mjs
      - name: Validate refreshed snapshot
        run: node --test
      - name: Commit only generated profile assets
        id: snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/contributions.json data/featured-project.json assets/contributions.svg assets/contributions-mobile.svg assets/hackathon-card.svg assets/hackathon-card-mobile.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh verified profile snapshots"
            git push origin HEAD:main
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.refresh.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - run: node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy calendar
        id: deployment
        uses: actions/deploy-pages@v4
